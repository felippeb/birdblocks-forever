# Every push to main and every pull request: parse the Lua, run the game and
# addon tests, build the archive, audit it. No secrets, read-only token.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
