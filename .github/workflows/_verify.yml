# Reusable verification: no secrets, read-only token, one pinned action.
#
# Called by ci.yml (every push and PR) and by release.yml (before publishing).
# Nothing here can reach the CurseForge token, which is the whole point of
# keeping it in a separate job.
name: verify

on:
  workflow_call:
    inputs:
      version:
        description: "Version label used for the throwaway archive name"
        type: string
        default: "0.0.0-ci"
      dry_run:
        description: "Also exercise the publish tool without contacting CurseForge"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to a commit, credentials not persisted
        # so no later step can push or read the token from .git/config.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Lua 5.4
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4
          lua5.4 -v

      - name: Install pinned Lua parser
        run: |
          set -euo pipefail
          python3 -m pip install \
            --require-hashes --only-binary=:all: --no-cache-dir \
            --disable-pip-version-check \
            -r requirements-lint.txt
          python3 -c "import luaparser; print('luaparser', luaparser.__name__, 'ok')"

      - name: Lua syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from luaparser import ast
          import pathlib, sys

          bad = []
          for path in pathlib.Path(".").rglob("*.lua"):
              if any(part in {".git", "release"} for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8-sig"))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all Lua files parse")
          PY

      - name: Game engine tests
        run: lua5.4 tests/run_engine.lua

      - name: Addon tests
        run: lua5.4 tests/run_ui.lua

      - name: Randomised playthrough
        run: lua5.4 tests/run_stress.lua

      - name: Generated Lua matches the generator
        # The atlas and audio tables are checked in; if someone edits the
        # generated files by hand this catches it without needing Pillow or
        # libsndfile in CI.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          atlas = pathlib.Path("BirdBlocks/src/generated_atlas.lua").read_text()
          audio = pathlib.Path("BirdBlocks/src/generated_audio.lua").read_text()
          problems = []

          if "Generated by tools/make_assets.py" not in atlas:
              problems.append("generated_atlas.lua lost its header")
          if "Generated by tools/make_assets.py" not in audio:
              problems.append("generated_audio.lua lost its header")

          for slot in ("gb_block", "gb_empty", "snes_block", "bird_a", "bird_b"):
              if slot not in atlas:
                  problems.append(f"atlas is missing slot {slot}")

          for name in ("move", "rotate", "lock", "line", "tetris", "level",
                       "pause", "over", "start"):
              if f"{name} = " not in audio:
                  problems.append(f"audio table is missing {name}")

          if not re.search(r"themeLength = \d+\.\d+", audio):
              problems.append("audio table has no themeLength")

          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("generated files look intact")
          PY

      - name: Release tool tests
        run: |
          set -euo pipefail
          python3 tools/test_cf_release.py
          python3 tools/test_audit_zip.py

      - name: Build archive
        env:
          VERSION: ${{ inputs.version }}
        run: pwsh -NoProfile -NonInteractive -File ./build-zip.ps1 -Version "$VERSION" -OutDir release

      - name: Audit archive
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/audit_zip.py --file "release/BirdBlocks-$VERSION.zip"

      - name: Publish tool dry run
        if: inputs.dry_run
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 tools/cf_release.py \
            --file "release/BirdBlocks-$VERSION.zip" \
            --version "$VERSION" \
            --release-type alpha \
            --dry-run
